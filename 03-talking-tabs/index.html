<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talking Tabs</title>
<script src="../shared/guest.js?v=2"></script>
<link rel="stylesheet" href="../shared/style.css?v=9">
<link rel="stylesheet" href="style.css?v=10">
<link rel="icon" id="favicon" href="data:,">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../" aria-label="All sessions">
      <span class="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      <span class="session-no">03</span>
      <span class="title">My Browser Tabs Are Talking Behind My Back</span>
    </a>
    <div class="spacer"></div>
  </header>

  <div class="layout">
    <main class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="me-badge" id="meBadge"><span class="sw"></span><span><small>this tab is</small><b id="meName">…</b></span></div>
      <div class="count" id="count"><b>1</b><span>tab online</span></div>
      <div class="empty-hint" id="emptyHint">
        <div class="eh-title">I'm all alone in here.</div>
        <button class="btn primary lg" id="spawnHero"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="on-mouse">Open a new window</span><span class="on-touch">Open a new tab</span></button>
      </div>
      <form class="chatbar" id="chatForm" autocomplete="off">
        <input type="text" id="chatIn" placeholder="Say something to the other tabs…" maxlength="80">
        <button class="btn primary" type="submit">Send</button>
      </form>
    </main>

    <aside class="side">
      <section class="card">
        <h3>Who's online <span class="muted" id="rosterCount"></span></h3>
        <div class="roster" id="roster"></div>
      </section>

      <section class="card">
        <h3>Do something together</h3>
        <div class="stack">
          <button class="btn block" id="spawnBtn"><span class="on-mouse">Open another window</span><span class="on-touch">Open another tab</span></button>
          <button class="btn block" id="ballBtn">Throw the ball</button>
          <button class="btn block" id="flashBtn">Flash every tab</button>
          <button class="btn block" id="titleBtn">Hijack tab titles</button>
        </div>
      </section>

      <section class="card">
        <h3>The gossip <span class="muted" id="rate">0 msg/s</span></h3>
        <label class="toggle">Show heartbeats <input type="checkbox" id="showHb"></label>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </div>
</div>


<script type="module" src="app.js?v=6"></script>
</body>
</html>
